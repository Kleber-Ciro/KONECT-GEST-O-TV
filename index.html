<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konect Gestão Cloud</title>
    <!-- BIBLIOTECAS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--dark); color: #ffd700; padding: 1rem; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .container { flex: 1; padding: 15px; max-width: 450px; margin: auto; width: 100%; box-sizing: border-box; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo-area { text-align: center; margin-bottom: 20px; }
        .logo-text { font-size: 2.5rem; font-weight: 900; color: var(--dark); margin: 0; }
        .logo-sub { color: var(--primary); font-weight: bold; display: block; margin-top: -5px; letter-spacing: 2px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        button { padding: 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-main { background: var(--primary); color: white; margin-top: 10px; }
        .btn-sec { background: var(--dark); color: white; margin-top: 10px; }
        .btn-save { background: var(--success); color: white; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hidden { display: none !important; }
        .client-card { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .footer-banner { background: #900; color: white; padding: 10px; text-align: center; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<header>KONECT GESTÃO CLOUD</header>

<div class="container">
    <!-- ACESSO -->
    <div id="view-login" class="card">
        <div class="logo-area">
            <h1 class="logo-text">KONECT</h1>
            <span class="logo-sub">GESTOR</span>
        </div>
        <input type="email" id="email" placeholder="Seu e-mail">
        <input type="password" id="pass" placeholder="Sua senha">
        <button class="btn-main" onclick="acaoLogin()">ENTRAR NO SISTEMA</button>
        <button class="btn-sec" onclick="acaoCriar()">CRIAR NOVA CONTA</button>
        <p id="status-msg" style="text-align:center; font-size:0.8rem; color: #666; margin-top: 15px;">Aguardando conexão...</p>
    </div>

    <!-- PAINEL -->
    <div id="view-panel" class="hidden">
        <div class="logo-area"><h1 class="logo-text">KONECT</h1><span class="logo-sub">PAINEL</span></div>
        <div class="menu-grid">
            <button class="btn-main" onclick="abrir('view-add')"><i class="fas fa-plus"></i> NOVO</button>
            <button class="btn-main" style="background:#28a745" onclick="abrir('view-list')"><i class="fas fa-search"></i> LISTA</button>
            <button class="btn-main" style="background:#ffc107; color:black" onclick="abrir('view-pix')"><i class="fas fa-qrcode"></i> PIX</button>
            <button class="btn-sec" onclick="logout()"><i class="fas fa-sign-out-alt"></i> SAIR</button>
        </div>
    </div>

    <!-- CADASTRO -->
    <div id="view-add" class="card hidden">
        <h3>Novo Cliente</h3>
        <input type="hidden" id="edit-id">
        <input type="text" id="nome" placeholder="Nome do Cliente">
        <input type="text" id="tel" placeholder="WhatsApp (551499...)">
        <input type="date" id="venc">
        <input type="number" id="valor" placeholder="Valor R$">
        <button class="btn-save" onclick="salvarCliente()">SALVAR NA NUVEM</button>
        <button class="btn-sec" onclick="abrir('view-panel')">VOLTAR</button>
    </div>

    <!-- LISTAGEM -->
    <div id="view-list" class="card hidden">
        <h3>Meus Clientes</h3>
        <div id="lista-clientes"></div>
        <button class="btn-sec" onclick="abrir('view-panel')" style="margin-top:20px">VOLTAR</button>
    </div>

    <!-- PIX -->
    <div id="view-pix" class="card hidden">
        <h3>Chave PIX</h3>
        <input type="text" id="chave-pix" placeholder="Sua chave PIX">
        <button class="btn-save" onclick="salvarPix()">SALVAR PIX</button>
        <button class="btn-sec" onclick="abrir('view-panel')" style="margin-top:20px">VOLTAR</button>
    </div>
</div>

<div class="footer-banner">SISTEMA SEGURO - KONECT MÍDIA</div>

<script>
    const SB_URL = "https://jjdpmtfoqpubbkghhvfc.supabase.co";
    const SB_KEY = "sb_publishable_wkYAu6MHnZ1XbZzzV3pfSQ_mfJrFh_7";
    let sb;
    let user = null;
    let dadosClientes = [];

    // Tenta conectar até conseguir
    const conectar = setInterval(() => {
        if (window.supabase) {
            sb = window.supabase.createClient(SB_URL, SB_KEY);
            document.getElementById('status-msg').innerText = "Sistema Online ✅";
            verificarSessao();
            clearInterval(conectar);
        }
    }, 500);

    async function acaoCriar() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        const { error } = await sb.auth.signUp({ email: e, password: p });
        if(error) alert("Erro: " + error.message);
        else alert("Conta solicitada! Verifique seu e-mail para confirmar (olhe o spam).");
    }

    async function acaoLogin() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pass').value;
        const { data, error } = await sb.auth.signInWithPassword({ email: e, password: p });
        if(error) alert("Falha: " + error.message);
        else { user = data.user; carregarDados(); }
    }

    async function carregarDados() {
        const { data } = await sb.from('clientes').select('*').eq('user_id', user.id);
        dadosClientes = data || [];
        const pix = localStorage.getItem('pix_' + user.id);
        if(pix) document.getElementById('chave-pix').value = pix;
        abrir('view-panel');
    }

    async function salvarCliente() {
        const id = document.getElementById('edit-id').value;
        const info = {
            nome: document.getElementById('nome').value,
            telefone: document.getElementById('tel').value,
            vencimento: document.getElementById('venc').value,
            valor: document.getElementById('valor').value,
            user_id: user.id
        };

        if(id) await sb.from('clientes').update(info).eq('id', id);
        else await sb.from('clientes').insert([info]);

        carregarDados();
    }

    function renderLista() {
        const div = document.getElementById('lista-clientes');
        div.innerHTML = dadosClientes.length ? '' : 'Nenhum cliente.';
        dadosClientes.forEach(c => {
            const item = document.createElement('div');
            item.className = 'client-card';
            item.innerHTML = `
                <div><b>${c.nome}</b><br><small>${c.vencimento}</small></div>
                <button class="btn-save" style="width:40px; padding:10px" onclick="zap('${c.telefone}','${c.nome}','${c.vencimento}','${c.valor}')"><i class="fab fa-whatsapp"></i></button>
            `;
            div.appendChild(item);
        });
    }

    function zap(tel, nome, venc, valor) {
        const pix = document.getElementById('chave-pix').value;
        const txt = `Olá ${nome}, seu acesso vence dia ${venc}. Valor: R$${valor}. PIX: ${pix}`;
        window.open(`https://wa.me/${tel}?text=${encodeURIComponent(txt)}`);
    }

    function abrir(id) {
        document.querySelectorAll('.card, #view-panel').forEach(v => v.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'view-list') renderLista();
    }

    function salvarPix() {
        localStorage.setItem('pix_' + user.id, document.getElementById('chave-pix').value);
        alert("PIX Salvo!");
        abrir('view-panel');
    }

    async function verificarSessao() {
        const { data } = await sb.auth.getSession();
        if(data.session) { user = data.session.user; carregarDados(); }
    }

    async function logout() { await sb.auth.signOut(); location.reload(); }
</script>
</body>
</html>
